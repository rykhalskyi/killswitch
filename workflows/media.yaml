id: media
name: Media services
requires:
  flux: suspended

# OFF scales workloads to zero; ON restores the replicas captured on the last
# OFF transition. states.on.default allows the first ON when no original has
# been recorded yet.
steps:
  - id: jellyfin
    action: kubernetes.scale
    target: {kind: Deployment, namespace: media, name: jellyfin}
    states:
      off: {replicas: 0}
      on: {restore: previous, default: 1}

  - id: sonarr
    action: kubernetes.scale
    target: {kind: Deployment, namespace: media, name: sonarr}
    states:
      off: {replicas: 0}
      on: {restore: previous, default: 1}
