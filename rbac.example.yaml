apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: killswitch-flux-freeze
rules:
  - apiGroups:
      - "kustomize.toolkit.fluxcd.io"
    resources:
      - "kustomizations"
    verbs:
      - "get"
      - "list"
      - "patch"
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - "helmreleases"
    verbs:
      - "get"
      - "list"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: killswitch-flux-freeze-binding
subjects:
  - kind: ServiceAccount
    name: killswitch
    namespace: default
roleRef:
  kind: ClusterRole
  name: killswitch-flux-freeze
  apiGroup: rbac.authorization.k8s.io
